name: CI

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} quality and tests
    runs-on: ubuntu-latest
    env:
      MINIPROTO_INTEGRATION: 0
      MINIPROTO_REAL_INTEGRATION: 0
      MINIPROTO_STRESS: 1
      PYTHON_GIL: "${{ matrix.python-version == '3.14t' && '0' || '1' }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Sync locked development environment
        run: uv sync --extra dev --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Schema freshness
        run: uv run miniproto-schema-generate --check

      - name: Tests
        run: |
          mkdir -p .tmp
          uv run pytest --basetemp=.tmp/pytest-ci-${{ matrix.python-version }}

  free-threaded:
    name: Python ${{ matrix.python-version }} free-threaded runtime
    runs-on: ubuntu-latest
    env:
      PYTHON_GIL: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: free-threaded-${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97"

      - name: Sync dependencies and build native extension
        run: |
          uv sync --python "${{ matrix.python-version }}" --extra dev --frozen
          uv run maturin develop --release --locked

      - name: Exercise the runtime with the GIL disabled
        shell: bash
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import sys
          import sysconfig
          from concurrent.futures import ThreadPoolExecutor

          import miniproto
          from miniproto import _native

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
          assert importlib.util.find_spec("cryptography") is not None
          assert importlib.util.find_spec("uvloop") is not None
          assert _native.native_available()
          record = miniproto.SessionRecord()
          protected = miniproto.export_session_string(record, passphrase="free-threaded CI")
          assert miniproto.import_session_string(protected, passphrase="free-threaded CI") == record
          payload = b"miniproto-free-threaded" * 256
          expected = _native.sha256_digest(payload)
          with ThreadPoolExecutor(max_workers=8) as executor:
              results = tuple(executor.map(_native.sha256_digest, (payload,) * 256))
          assert all(result == expected for result in results)
          PY

  rust:
    name: Rust 1.97 checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
          toolchain: "1.97"

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  benchmark-smoke:
    name: Deterministic benchmark smoke
    needs: [python, rust]
    runs-on: ubuntu-latest
    env:
      MINIPROTO_INTEGRATION: 0
      MINIPROTO_REAL_INTEGRATION: 0
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: benchmark

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97"

      - name: Sync and build native extension
        run: |
          uv sync --extra dev --frozen
          uv run maturin develop --release

      - name: Run deterministic benchmark gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/benchmark-smoke
          uv run miniproto-bench-acceptance --mode smoke --json .tmp/benchmark-smoke/runtime-acceptance.json > .tmp/benchmark-smoke/runtime-acceptance.log
          uv run miniproto-bench-imports --runs 3 > .tmp/benchmark-smoke/imports.json
          uv run miniproto-bench-media-scheduler > .tmp/benchmark-smoke/media-scheduler.json
          uv run miniproto-bench-native-fallback-crypto --mode smoke --json .tmp/benchmark-smoke/native-fallback.json > .tmp/benchmark-smoke/native-fallback.log
          uv run miniproto-bench-runtime-paths > .tmp/benchmark-smoke/runtime-paths.log
          uv run miniproto-bench-session-crypto --mode smoke --json .tmp/benchmark-smoke/session-crypto.json > .tmp/benchmark-smoke/session-crypto.log
          uv run miniproto-bench-tl-fast-paths --check --mode smoke --json .tmp/benchmark-smoke/tl-fast-paths.json > .tmp/benchmark-smoke/tl-fast-paths.log
          uv run miniproto-bench-transport-framing --check --mode smoke --json .tmp/benchmark-smoke/transport-framing.json > .tmp/benchmark-smoke/transport-framing.log
          uv run miniproto-profile-lazy-raw-codec > .tmp/benchmark-smoke/lazy-raw-codec.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-smoke-linux-x86_64-py314
          path: .tmp/benchmark-smoke/
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: Source distribution
    needs: [python, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: sdist

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97"

      - name: Build sdist
        run: |
          uv sync --extra dev --frozen
          uv run maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
