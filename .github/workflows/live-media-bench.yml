name: Live Media Benchmark

on:
  workflow_dispatch:
    inputs:
      actor:
        description: "Which authorized account to benchmark"
        required: true
        default: "both"
        type: choice
        options:
          - user
          - bot
          - both
      user_auth_mode:
        description: "How user login is supplied when no user session secret is restored"
        required: true
        default: "session"
        type: choice
        options:
          - session
          - cloudflared-code
      operation:
        description: "Transfer operation to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - upload
          - download
      repeat:
        description: "Repeat each selected actor/profile; use >1 for noisy Telegram lane A/B runs"
        required: true
        default: "1"
        type: number
      file_id:
        description: "miniproto file id for download-only runs"
        required: false
        default: ""
      size:
        description: "Payload size: telegram-default, 2000mib, 512mib, 2gb, or bytes"
        required: true
        default: "telegram-default"
      dc_id:
        description: "Production DC id for the benchmark sessions"
        required: true
        default: "4"
      upload_concurrency:
        description: "Concurrent upload part requests"
        required: true
        default: "8"
      upload_media_lanes:
        description: "Upload MTProto sender lanes; 2 was fastest in the July 2026 DC4 VPS run, 0 uses the legacy main sender"
        required: false
        default: "2"
      download_concurrency:
        description: "Maximum concurrent download part requests; default 6 pipelines ~3 requests per lane (TASK-P1-1)"
        required: true
        default: "6"
      download_media_lanes:
        description: "Download MTProto sender lanes; default 2 matches the TASK-P1-1 library default (mtcute 2x3), 0 uses the legacy main sender"
        required: false
        default: "2"
      download_adaptive_concurrency:
        description: "Enable download pacing/throttle: pace launches after flood waits and shrink only on disconnects/timeouts"
        required: true
        default: true
        type: boolean
      download_chunk_size:
        description: "upload.getFile chunk size in bytes; 524288 is stable, 1048576 tests the 1 MiB path"
        required: true
        default: "524288"
      download_max_in_flight_bytes:
        description: "Max in-flight download bytes; empty uses the library floor max(8 MiB, part_size * concurrency)"
        required: false
        default: ""
      download_adaptive_part_size:
        description: "Try larger download chunks during large transfers and keep the fastest observed size"
        required: true
        default: true
        type: boolean
      download_max_chunk_size:
        description: "Largest adaptive upload.getFile chunk size to try"
        required: true
        default: "1048576"
      download_read_ahead_bytes:
        description: "Optional range-cache read-ahead bytes; 0 disables read-ahead"
        required: true
        default: "0"
      download_range_cache_bytes:
        description: "Optional in-memory range cache bytes; 0 disables range caching"
        required: true
        default: "0"
      request_timeout:
        description: "Client transport/request timeout in seconds"
        required: true
        default: "120"
      upload_request_timeout:
        description: "Upload part timeout in seconds"
        required: false
        default: "45"
      download_request_timeout:
        description: "Download part timeout in seconds"
        required: true
        default: "30"
      verify_digest:
        description: "Hash source and download after each transfer"
        required: true
        default: false
        type: boolean
      trace_memory:
        description: "Enable tracemalloc-backed memory diagnostics"
        required: true
        default: false
        type: boolean
      log_level:
        description: "miniproto benchmark log level"
        required: true
        default: "INFO"

concurrency:
  group: miniproto-live-media-bench
  cancel-in-progress: false

jobs:
  live-media-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MINIPROTO_LIVE_BENCH: "1"
      MINIPROTO_INTEGRATION: "1"
      MINIPROTO_REAL_INTEGRATION: "1"
      MINIPROTO_API_ID: ${{ secrets.MINIPROTO_API_ID }}
      MINIPROTO_API_HASH: ${{ secrets.MINIPROTO_API_HASH }}
      MINIPROTO_SESSION_KEY: ${{ secrets.MINIPROTO_SESSION_KEY }}
      MINIPROTO_REAL_PHONE: ${{ secrets.MINIPROTO_REAL_PHONE }}
      MINIPROTO_REAL_PASSWORD: ${{ secrets.MINIPROTO_REAL_PASSWORD }}
      MINIPROTO_BOT_TOKEN: ${{ secrets.MINIPROTO_BOT_TOKEN }}
      MINIPROTO_LIVE_BENCH_USER_PEER: ${{ secrets.MINIPROTO_LIVE_BENCH_USER_PEER }}
      MINIPROTO_LIVE_BENCH_BOT_PEER: ${{ secrets.MINIPROTO_LIVE_BENCH_BOT_PEER }}
      MINIPROTO_LIVE_BENCH_USER_SESSION_B64: ${{ secrets.MINIPROTO_LIVE_BENCH_USER_SESSION_B64 }}
      MINIPROTO_LIVE_BENCH_BOT_SESSION_B64: ${{ secrets.MINIPROTO_LIVE_BENCH_BOT_SESSION_B64 }}
      MINIPROTO_LIVE_BENCH_LOG_LEVEL: ${{ inputs.log_level }}
      MINIPROTO_LIVE_BENCH_LOG_FORMAT: "text"
      MINIPROTO_LIVE_BENCH_HTTP_CODE_PORT: "8765"
      MINIPROTO_LIVE_BENCH_HTTP_CODE_TIMEOUT: "900"
      MINIPROTO_LIVE_BENCH_REQUEST_TIMEOUT: ${{ inputs.request_timeout }}
      MINIPROTO_LIVE_BENCH_UPLOAD_REQUEST_TIMEOUT: ${{ inputs.upload_request_timeout }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_REQUEST_TIMEOUT: ${{ inputs.download_request_timeout }}
      MINIPROTO_LIVE_BENCH_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_CONCURRENCY: ${{ inputs.download_concurrency }}
      MINIPROTO_LIVE_BENCH_UPLOAD_MEDIA_LANES: ${{ inputs.upload_media_lanes }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_MEDIA_LANES: ${{ inputs.download_media_lanes }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_CHUNK_SIZE: ${{ inputs.download_chunk_size }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_MAX_IN_FLIGHT_BYTES: ${{ inputs.download_max_in_flight_bytes }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_ADAPTIVE_PART_SIZE: ${{ inputs.download_adaptive_part_size }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_MAX_CHUNK_SIZE: ${{ inputs.download_max_chunk_size }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_READ_AHEAD_BYTES: ${{ inputs.download_read_ahead_bytes }}
      MINIPROTO_LIVE_BENCH_DOWNLOAD_RANGE_CACHE_BYTES: ${{ inputs.download_range_cache_bytes }}
      MINIPROTO_LIVE_BENCH_SIZE: ${{ inputs.size }}
      MINIPROTO_LIVE_BENCH_DC_ID: ${{ inputs.dc_id }}
      MINIPROTO_LIVE_BENCH_ACTOR: ${{ inputs.actor }}
      MINIPROTO_LIVE_BENCH_OPERATION: ${{ inputs.operation }}
      MINIPROTO_LIVE_BENCH_REPEAT: ${{ inputs.repeat }}
      MINIPROTO_LIVE_BENCH_FILE_ID: ${{ inputs.file_id }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install Python
        run: uv python install 3.14
      - name: Sync
        run: uv sync --extra dev
      - name: Restore optional benchmark sessions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          restore_session() {
            local actor="$1"
            local data="$2"
            local target=".tmp/miniproto-live-bench-${actor}-dc${{ inputs.dc_id }}.sqlite"
            if [ -n "${data}" ]; then
              printf '%s' "${data}" | base64 --decode > "${target}"
              chmod 600 "${target}"
              echo "restored ${actor} session to ${target}"
            fi
          }
          restore_session "user" "${MINIPROTO_LIVE_BENCH_USER_SESSION_B64:-}"
          restore_session "bot" "${MINIPROTO_LIVE_BENCH_BOT_SESSION_B64:-}"
      - name: Prepare optional user code tunnel
        if: ${{ inputs.actor != 'bot' && inputs.user_auth_mode == 'cloudflared-code' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/live-bench-results
          token="$(uv run python -c "import secrets; print(secrets.token_urlsafe(24))")"
          echo "MINIPROTO_LIVE_BENCH_CODE_PROMPT=http" >> "${GITHUB_ENV}"
          echo "MINIPROTO_LIVE_BENCH_HTTP_CODE_TOKEN=${token}" >> "${GITHUB_ENV}"
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o .tmp/cloudflared
          chmod 700 .tmp/cloudflared
          .tmp/cloudflared tunnel --url "http://127.0.0.1:${MINIPROTO_LIVE_BENCH_HTTP_CODE_PORT}" --no-autoupdate > .tmp/live-bench-results/cloudflared.log 2>&1 &
          echo "$!" > .tmp/live-bench-results/cloudflared.pid
          for _ in $(seq 1 60); do
            tunnel_url="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' .tmp/live-bench-results/cloudflared.log | head -n 1 || true)"
            if [ -n "${tunnel_url}" ]; then
              echo "MINIPROTO_LIVE_BENCH_HTTP_CODE_PUBLIC_BASE_URL=${tunnel_url}" >> "${GITHUB_ENV}"
              echo "Telegram login code form will be available for 15 minutes once the benchmark asks for a code:"
              echo "${tunnel_url}/${token}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::cloudflared did not print a trycloudflare URL in time"
          cat .tmp/live-bench-results/cloudflared.log || true
          exit 2
      - name: Check non-interactive session requirements
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.actor }}" != "bot" ] && [ ! -s ".tmp/miniproto-live-bench-user-dc${{ inputs.dc_id }}.sqlite" ] && [ "${{ inputs.user_auth_mode }}" != "cloudflared-code" ]; then
            echo "::error::User benchmarks on GitHub-hosted runners need MINIPROTO_LIVE_BENCH_USER_SESSION_B64 unless user_auth_mode is cloudflared-code."
            exit 2
          fi
      - name: Run live media benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/live-bench-results
          extra_args=()
          if [ "${{ inputs.verify_digest }}" = "true" ]; then
            extra_args+=(--verify-digest)
          fi
          if [ "${{ inputs.trace_memory }}" = "true" ]; then
            extra_args+=(--trace-memory)
          fi
          if [ "${{ inputs.download_adaptive_concurrency }}" = "true" ]; then
            extra_args+=(--download-adaptive-concurrency)
          else
            extra_args+=(--no-download-adaptive-concurrency)
          fi
          if [ "${{ inputs.download_adaptive_part_size }}" = "true" ]; then
            extra_args+=(--download-adaptive-part-size)
          else
            extra_args+=(--no-download-adaptive-part-size)
          fi
          if [ -n "${{ inputs.upload_media_lanes }}" ]; then
            extra_args+=(--upload-media-lanes "${{ inputs.upload_media_lanes }}")
          fi
          if [ -n "${{ inputs.download_media_lanes }}" ]; then
            extra_args+=(--download-media-lanes "${{ inputs.download_media_lanes }}")
          fi
          if [ -n "${{ inputs.file_id }}" ]; then
            extra_args+=(--file-id "${{ inputs.file_id }}")
          fi
          if [ -n "${{ inputs.download_max_in_flight_bytes }}" ]; then
            extra_args+=(--download-max-in-flight-bytes "${{ inputs.download_max_in_flight_bytes }}")
          fi
          uv run python -u tools/bench/benchmark_live_media_limit.py \
            --actor "${{ inputs.actor }}" \
            --operation "${{ inputs.operation }}" \
            --repeat "${{ inputs.repeat }}" \
            --size "${{ inputs.size }}" \
            --dc-id "${{ inputs.dc_id }}" \
            --upload-concurrency "${{ inputs.upload_concurrency }}" \
            --download-concurrency "${{ inputs.download_concurrency }}" \
            --download-chunk-size "${{ inputs.download_chunk_size }}" \
            --download-max-chunk-size "${{ inputs.download_max_chunk_size }}" \
            --download-read-ahead-bytes "${{ inputs.download_read_ahead_bytes }}" \
            --download-range-cache-bytes "${{ inputs.download_range_cache_bytes }}" \
            --request-timeout "${{ inputs.request_timeout }}" \
            --download-request-timeout "${{ inputs.download_request_timeout }}" \
            --json .tmp/live-bench-results/summary.json \
            "${extra_args[@]}" 2>&1 | tee .tmp/live-bench-results/live-media-bench.log
      - name: Upload benchmark summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-media-bench-${{ inputs.actor }}-dc${{ inputs.dc_id }}
          path: |
            .tmp/live-bench-results/summary.json
            .tmp/live-bench-results/live-media-bench.log
            .tmp/live-bench-results/cloudflared.log
          if-no-files-found: warn
