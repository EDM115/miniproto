name: Publish release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build release artifacts workflow run ID
        required: true
        type: string
      version:
        description: Exact release version without the v prefix
        required: true
        type: string
      keep_draft:
        description: Keep the GitHub release as a draft after publishing packages
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub release as a prerelease instead of latest
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build provenance and release candidate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      run_attempt: ${{ steps.build-run.outputs.run_attempt }}
      source_sha: ${{ steps.build-run.outputs.source_sha }}
      tag: ${{ steps.build-run.outputs.tag }}
    steps:
      - name: Validate dispatch inputs and source build run
        id: build-run
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "EDM115/miniproto" ]]; then
            printf 'publication is restricted to EDM115/miniproto, got %s\n' "$GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            printf 'dispatch Publish release from master, got %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            printf 'build_run_id must be a positive integer\n' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.!+_-]*)?$ ]]; then
            printf 'version must be an exact release version without a v prefix\n' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("build-run.json").read_text(encoding="utf-8"))
          expected = {
              "conclusion": "success",
              "event": "workflow_dispatch",
              "id": int(os.environ["BUILD_RUN_ID"]),
              "path": ".github/workflows/build-wheels.yml",
              "status": "completed",
          }
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"source build run {key} mismatch: expected {value!r}, found {run.get(key)!r}")
          repository = run.get("repository")
          if not isinstance(repository, dict) or repository.get("full_name") != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("source build run belongs to a different repository")
          source_sha = run.get("head_sha")
          run_attempt = run.get("run_attempt")
          if not isinstance(source_sha, str) or len(source_sha) != 40:
              raise SystemExit(f"source build run returned an invalid commit SHA: {source_sha!r}")
          if not isinstance(run_attempt, int) or run_attempt <= 0:
              raise SystemExit(f"source build run returned an invalid attempt: {run_attempt!r}")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8", newline="\n") as handle:
              handle.write(f"run_attempt={run_attempt}\n")
              handle.write(f"source_sha={source_sha}\n")
              handle.write(f"tag=v{os.environ['RELEASE_VERSION']}\n")
          print(f"Verified successful build run {run['id']} attempt {run_attempt} at {source_sha}.")
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.build-run.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify release commit, versions and unused tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.build-run.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            printf 'release tag v%s already exists\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["RELEASE_VERSION"]
          with open("pyproject.toml", "rb") as handle:
              python_version = tomllib.load(handle)["project"]["version"]
          with open("rust/miniproto/Cargo.toml", "rb") as handle:
              cargo_version = tomllib.load(handle)["package"]["version"]
          if python_version != expected or cargo_version != expected:
              raise SystemExit(
                  f"version mismatch: input={expected!r}, Python={python_version!r}, Cargo={cargo_version!r}"
              )
          print(f"Verified Python and Cargo version {expected} at {os.environ['SOURCE_SHA']}.")
          PY

      - name: Download exact build-run artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          path: release-artifacts
          merge-multiple: true
          digest-mismatch: error

      - name: Verify manifest, checksums and embedded package metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.release_artifacts verify \
            --artifacts-dir release-artifacts \
            --manifest release-artifacts/release-manifest.json \
            --checksums release-artifacts/SHA256SUMS \
            --version "${{ inputs.version }}" \
            --repository "${{ github.repository }}" \
            --workflow .github/workflows/build-wheels.yml \
            --run-id "${{ inputs.build_run_id }}" \
            --run-attempt "${{ steps.build-run.outputs.run_attempt }}" \
            --source-sha "${{ steps.build-run.outputs.source_sha }}" \
            --event workflow_dispatch

      - name: Verify every GitHub build attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.build-run.outputs.source_sha }}
        run: |
          set -euo pipefail
          signer="$GITHUB_REPOSITORY/.github/workflows/build-wheels.yml"
          while IFS= read -r -d '' artifact; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$signer" \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners
          done < <(find release-artifacts -maxdepth 1 -type f -print0 | sort -z)

      - name: Stage verified publication inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verified/python verified/crate verified/release
          cp release-artifacts/*.whl release-artifacts/*.tar.gz verified/python/
          cp release-artifacts/*.crate verified/crate/
          cp release-artifacts/* verified/release/

      - name: Preserve verified Python distributions for the isolated PyPI job
        uses: actions/upload-artifact@v7
        with:
          name: verified-python-distributions
          path: verified/python/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve verified Cargo package for registry comparison
        uses: actions/upload-artifact@v7
        with:
          name: verified-rust-crate
          path: verified/crate/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve verified GitHub release assets
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: verified/release/
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create and populate draft GitHub release
    needs: [verify]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - name: Download verified release assets
        uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: release-assets
          digest-mismatch: error

      - name: Create or resume the matching draft and attach missing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -euo pipefail
          python -m tools.release_artifacts notes \
            --changelog CHANGELOG.md \
            --output-dir release-metadata
          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft
            --prerelease="$PRERELEASE"
            --title "$(cat release-metadata/release-title.txt)"
            --notes-file release-metadata/release-notes.md
          )
          release_assets=(release-assets/*)
          existing_release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          if [[ -n "$existing_release_id" ]]; then
            if [[ ! "$existing_release_id" =~ ^[1-9][0-9]*$ ]]; then
              printf 'multiple GitHub releases already use %s\n' "$RELEASE_TAG" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/releases/$existing_release_id" > existing-release.json
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("existing-release.json").read_text(encoding="utf-8"))
          if release.get("draft") is not True or release.get("target_commitish") != os.environ["SOURCE_SHA"]:
              raise SystemExit("existing GitHub release must be a draft targeting the verified source commit")
          expected = {path.name: path for path in Path("release-assets").iterdir() if path.is_file()}
          assets = release["assets"]
          existing_names = {asset["name"] for asset in assets}
          if len(existing_names) != len(assets) or existing_names - expected.keys():
              raise SystemExit("existing GitHub draft contains duplicate or unexpected assets")
          for asset in assets:
              digest = "sha256:" + hashlib.sha256(expected[asset["name"]].read_bytes()).hexdigest()
              if asset.get("digest") != digest:
                  raise SystemExit(f"existing GitHub draft asset differs from the attested candidate: {asset['name']}")
          missing = [path.as_posix() + "\n" for name, path in sorted(expected.items()) if name not in existing_names]
          Path("release-metadata/assets-to-upload.txt").write_text("".join(missing), encoding="utf-8", newline="\n")
          PY
            mapfile -t release_assets < release-metadata/assets-to-upload.txt
            gh release edit "${release_args[@]}"
          else
            gh release create "${release_args[@]}" --target "$SOURCE_SHA"
          fi
          if [[ ${#release_assets[@]} -gt 0 ]]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${release_assets[@]}"
          fi

  crates:
    name: Publish verified source to crates.io
    needs: [verify, draft-release]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.99.0"

      - name: Download the attested Cargo package for registry comparison
        uses: actions/download-artifact@v8
        with:
          name: verified-rust-crate
          path: verified-crate
          digest-mismatch: error

      - name: Obtain short-lived crates.io token
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish or verify the attested crates.io package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          expected="verified-crate/miniproto-$RELEASE_VERSION.crate"
          registry="registry-miniproto-$RELEASE_VERSION.crate"
          registry_metadata_url="https://crates.io/api/v1/crates/miniproto/$RELEASE_VERSION"
          registry_url="https://crates.io/api/v1/crates/miniproto/$RELEASE_VERSION/download"
          curl_args=(--location --silent --show-error --user-agent "miniproto-release-publisher (https://github.com/EDM115/miniproto)")

          if ! existing_status="$(curl "${curl_args[@]}" --output registry-version.json --write-out '%{http_code}' "$registry_metadata_url")"; then
            printf 'could not determine whether crates.io already contains miniproto %s\n' "$RELEASE_VERSION" >&2
            exit 1
          fi
          if [[ "$existing_status" == "200" ]]; then
            curl "${curl_args[@]}" --fail --output "$registry" "$registry_url"
            cmp --silent "$expected" "$registry" || {
              printf 'existing crates.io archive differs from the attested build artifact\n' >&2
              exit 1
            }
            printf 'crates.io already contains the attested Cargo package; no duplicate publish is needed.\n'
            exit 0
          fi
          if [[ "$existing_status" != "404" ]]; then
            printf 'unexpected crates.io lookup status before publication: %s\n' "$existing_status" >&2
            exit 1
          fi

          cargo publish --locked -p miniproto
          for attempt in {1..12}; do
            if curl "${curl_args[@]}" --fail \
              "$registry_url" \
              --output "$registry"; then
              break
            fi
            if [[ $attempt -eq 12 ]]; then
              printf 'crates.io package did not become downloadable after publication\n' >&2
              exit 1
            fi
            sleep 10
          done
          cmp --silent "$expected" "$registry" || {
            printf 'published crates.io archive differs from the attested build artifact; keep the GitHub release as a draft and inspect/yank the crate\n' >&2
            exit 1
          }
          printf 'Published crates.io archive exactly matches the attested build artifact.\n'

  pypi:
    name: Publish verified Python distributions to PyPI
    needs: [verify, crates]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/p/miniproto
    permissions:
      id-token: write
    steps:
      - name: Download verified Python distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-python-distributions
          path: dist
          digest-mismatch: error

      - name: Select only missing byte-identical PyPI files
        id: prepare-pypi
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import urllib.error
          import urllib.request
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          output = Path(os.environ["GITHUB_OUTPUT"])
          candidates = sorted(path for path in Path("dist").iterdir() if path.suffix == ".whl" or path.name.endswith(".tar.gz"))
          if not candidates:
              raise SystemExit("no verified Python distributions were downloaded")

          endpoint = f"https://pypi.org/pypi/miniproto/{version}/json"
          try:
              with urllib.request.urlopen(endpoint, timeout=30) as response:
                  metadata = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              metadata = {"urls": []}

          published = {item["filename"]: item for item in metadata.get("urls", [])}
          unknown = sorted(set(published) - {path.name for path in candidates})
          if unknown:
              raise SystemExit(f"PyPI already contains unexpected files for {version}: {', '.join(unknown)}")

          publish_dir = Path("publish-dist")
          publish_dir.mkdir()
          for candidate in candidates:
              remote = published.get(candidate.name)
              if remote is None:
                  shutil.copy2(candidate, publish_dir / candidate.name)
                  continue
              candidate_sha256 = hashlib.sha256(candidate.read_bytes()).hexdigest()
              advertised_sha256 = remote.get("digests", {}).get("sha256")
              if advertised_sha256 != candidate_sha256:
                  raise SystemExit(f"PyPI digest differs from the attested candidate: {candidate.name}")
              with urllib.request.urlopen(remote["url"], timeout=60) as response:
                  downloaded_sha256 = hashlib.sha256(response.read()).hexdigest()
              if downloaded_sha256 != candidate_sha256:
                  raise SystemExit(f"downloaded PyPI file differs from the attested candidate: {candidate.name}")

          has_missing = any(publish_dir.iterdir())
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"has_missing={'true' if has_missing else 'false'}\n")
          print(f"PyPI already has {len(published)} verified files; {sum(1 for _ in publish_dir.iterdir())} remain to publish")
          PY

      - name: Publish to PyPI through Trusted Publishing
        if: steps.prepare-pypi.outputs.has_missing == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist
          attestations: true
          print-hash: true

  publish-release:
    name: Publish immutable GitHub release
    if: ${{ !inputs.keep_draft }}
    needs: [verify, pypi]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify the populated release is still a draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish \
            --jq 'select(.isDraft == true and .targetCommitish == "${{ needs.verify.outputs.source_sha }}")' \
            | grep -q .

      - name: Publish the populated draft as latest or prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          latest=true
          if [[ "$PRERELEASE" == "true" ]]; then
            latest=false
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$PRERELEASE" \
            --latest="$latest"
