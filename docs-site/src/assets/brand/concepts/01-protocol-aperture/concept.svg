<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Protocol Aperture logo concept for miniproto</title>
  <desc id="description">Three offset rounded protocol frames progress from cyan to blue to violet around one data pulse, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="aperture-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08D7E8"/><stop offset=".58" stop-color="#02C9DA"/><stop offset="1" stop-color="#08B8D3"/></linearGradient>
    <linearGradient id="aperture-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0878F9"/><stop offset="1" stop-color="#1658EE"/></linearGradient>
    <linearGradient id="aperture-violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8D50FA"/><stop offset="1" stop-color="#7435EE"/></linearGradient>
    <linearGradient id="wordmark-proto-gradient" gradientUnits="userSpaceOnUse" x1="158" y1="0" x2="370" y2="0"><stop stop-color="#1268F6"/><stop offset=".55" stop-color="#1760F5"/><stop offset="1" stop-color="#8A42F5"/></linearGradient>
    <style>@font-face{font-family:'Miniproto Nunito Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:800;font-display:block}.wordmark-heavy{font-family:'Miniproto Nunito Embedded';font-size:84px;font-style:normal;font-weight:800;letter-spacing:-2px}</style>
    <text id="wordmark-color" x="0" y="70" class="wordmark-heavy"><tspan fill="currentColor">mini</tspan><tspan fill="url(#wordmark-proto-gradient)">proto</tspan></text>
    <text id="wordmark-mono" x="0" y="70" class="wordmark-heavy" fill="currentColor">miniproto</text>
    <g id="mark-color" fill="none" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 8c7-1 13 2 19 8l43 43c10 10 10 22 0 32l-43 43c-6 6-12 9-19 8" stroke="url(#aperture-violet)"/>
      <path d="M82 8c7-1 13 2 19 8l43 43c10 10 10 22 0 32l-43 43c-6 6-12 9-19 8" stroke="url(#aperture-blue)"/>
      <path d="M53 23c7 0 12 2 18 8l32 32c10 10 10 20 0 30l-32 32c-10 10-23 10-33 0L7 94c-10-10-10-22 0-32l31-31c5-5 10-8 15-8Z" stroke="url(#aperture-cyan)"/>
      <circle cx="55" cy="78" r="13" fill="#04CFDF" stroke="none"/>
    </g>
    <g id="mark-mono" fill="none" stroke="currentColor" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 8c7-1 13 2 19 8l43 43c10 10 10 22 0 32l-43 43c-6 6-12 9-19 8"/><path d="M82 8c7-1 13 2 19 8l43 43c10 10 10 22 0 32l-43 43c-6 6-12 9-19 8"/><path d="M53 23c7 0 12 2 18 8l32 32c10 10 10 20 0 30l-32 32c-10 10-23 10-33 0L7 94c-10-10-10-22 0-32l31-31c5-5 10-8 15-8Z"/><circle cx="55" cy="78" r="13" fill="currentColor" stroke="none"/>
    </g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#E9EEF8"/>
  <rect x="24" y="24" width="564" height="300" rx="22" fill="#FAFCFF" stroke="#CDD6E8"/>
  <rect x="612" y="24" width="564" height="300" rx="22" fill="#081226"/>
  <rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFFFF" stroke="#CDD6E8"/>
  <rect x="612" y="348" width="564" height="348" rx="22" fill="#10182B"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(62 91) scale(.75)"/>
  <use href="#wordmark-color" xlink:href="#wordmark-color" transform="translate(224 112) scale(.91)" style="color:#080F21"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(650 91) scale(.75)"/>
  <use href="#wordmark-color" xlink:href="#wordmark-color" transform="translate(812 112) scale(.91)" style="color:#F8FAFF"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(72 400) scale(.90)"/>
  <use href="#wordmark-color" xlink:href="#wordmark-color" transform="translate(264 440) scale(.79)" style="color:#080F21"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(91 568) scale(.58)" style="color:#121B2E"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(662 399) scale(.80)" style="color:#FFFFFF"/>
  <use href="#wordmark-mono" xlink:href="#wordmark-mono" transform="translate(834 436) scale(.76)" style="color:#FFFFFF"/>
