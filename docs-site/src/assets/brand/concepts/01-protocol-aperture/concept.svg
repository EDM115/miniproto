<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Protocol Aperture logo concept for miniproto</title>
  <desc id="description">Three offset rounded protocol frames progress from cyan to blue to violet around one data pulse, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="aperture-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00E5E8"/><stop offset="1" stop-color="#00BFD4"/></linearGradient>
    <linearGradient id="aperture-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1687FF"/><stop offset="1" stop-color="#2155F5"/></linearGradient>
    <linearGradient id="aperture-violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A66BFF"/><stop offset="1" stop-color="#6F35F4"/></linearGradient>
    <g id="wordmark" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 60V28c0-9 6-15 14-15s14 6 14 15v32M32 28c0-9 6-15 14-15s14 6 14 15v32M80 22v38M80 5h.01M100 60V28c0-9 6-15 16-15s16 6 16 15v32M152 22v38M152 5h.01M172 78V13m0 17c0-10 7-17 16-17 11 0 18 9 18 23s-7 24-18 24c-9 0-16-7-16-17M226 60V30c0-10 7-17 17-17m-17 15c4-9 11-15 20-15M280 13c-13 0-22 10-22 23s9 24 22 24 22-11 22-24-9-23-22-23ZM330 2v44c0 10 5 15 14 15M318 18h27M382 13c-13 0-22 10-22 23s9 24 22 24 22-11 22-24-9-23-22-23Z"/>
    </g>
    <g id="mark-color" fill="none" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M107 16 155 64 107 112" stroke="url(#aperture-violet)"/>
      <path d="M72 16 120 64 72 112" stroke="url(#aperture-blue)"/>
      <path d="M53 16 101 64 53 112 5 64Z" stroke="url(#aperture-cyan)"/>
      <circle cx="53" cy="64" r="10" fill="#00D9E6" stroke="none"/>
    </g>
    <g id="mark-mono" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M107 16 155 64 107 112"/><path d="M72 16 120 64 72 112"/><path d="M53 16 101 64 53 112 5 64Z"/><circle cx="53" cy="64" r="10" fill="currentColor" stroke="none"/>
    </g>
  </defs>
