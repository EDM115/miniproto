  <g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#FAFCFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(1 7) scale(.28)"/></g>
  <g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#FAFCFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(2 5) scale(.16)"/></g>
</svg>
