<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Duplex Rails logo concept for miniproto</title>
  <desc id="description">Cobalt and coral rounded transport rails weave into an abstract m-p monogram around one packet gap, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="rail-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1669FA"/><stop offset="1" stop-color="#1754ED"/></linearGradient>
    <linearGradient id="rail-coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF5245"/><stop offset="1" stop-color="#FF3F35"/></linearGradient>
    <style>@font-face{font-family:'Miniproto Nunito Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:800;font-display:block}.wordmark-heavy{font-family:'Miniproto Nunito Embedded';font-size:84px;font-style:normal;font-weight:800;letter-spacing:-2px}</style>
    <text id="wordmark" x="0" y="70" class="wordmark-heavy" fill="currentColor">miniproto</text>
    <g id="mark-color" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M61 52v27c0 22 14 35 35 35h22c25 0 41-18 41-45V52c0-24-17-38-38-38-15 0-27 7-38 20" stroke="url(#rail-coral)" stroke-width="22"/><path d="M15 136V51C15 23 34 6 59 6c17 0 31 7 43 20l14 17" stroke="url(#rail-blue)" stroke-width="22"/><path d="M124 60v82" stroke="url(#rail-blue)" stroke-width="22"/><path d="M79 74h18" stroke="#0B1427" stroke-width="11"/></g>
    <g id="mark-dark" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M61 52v27c0 22 14 35 35 35h22c25 0 41-18 41-45V52c0-24-17-38-38-38-15 0-27 7-38 20" stroke="#FF5145" stroke-width="22"/><path d="M15 136V51C15 23 34 6 59 6c17 0 31 7 43 20l14 17" stroke="#1D68FA" stroke-width="22"/><path d="M124 60v82" stroke="#1D68FA" stroke-width="22"/><path d="M79 74h18" stroke="#F8FAFD" stroke-width="11"/></g>
    <g id="mark-mono" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M61 52v27c0 22 14 35 35 35h22c25 0 41-18 41-45V52c0-24-17-38-38-38-15 0-27 7-38 20"/><path d="M15 136V51C15 23 34 6 59 6c17 0 31 7 43 20l14 17"/><path d="M124 60v82"/><path d="M79 74h18" stroke-width="11"/></g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#E7ECF6"/><rect x="24" y="24" width="564" height="300" rx="22" fill="#FAFCFF" stroke="#CDD6E8"/><rect x="612" y="24" width="564" height="300" rx="22" fill="#0A1328"/><rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFFFF" stroke="#CDD6E8"/><rect x="612" y="348" width="564" height="348" rx="22" fill="#10192D"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(60 111) scale(.82)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(210 113) scale(.87)" style="color:#0B1427"/><use href="#mark-dark" xlink:href="#mark-dark" transform="translate(648 111) scale(.82)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(798 113) scale(.87)" style="color:#F8FAFD"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(70 422) scale(.90)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(240 444) scale(.78)" style="color:#0B1427"/><use href="#mark-mono" xlink:href="#mark-mono" transform="translate(91 580) scale(.67)" style="color:#111827"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(670 422) scale(.78)" style="color:#FFFFFF"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(815 438) scale(.75)" style="color:#FFFFFF"/>
  <g transform="translate(690 585)"><rect width="82" height="82" rx="18" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 10) scale(.48)"/></g><g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 10) scale(.31)"/></g><g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 9) scale(.18)"/></g>
