<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-4 -4 152 144" role="img" aria-labelledby="title description">
  <title id="title">Packet Loom mark</title>
  <desc id="description">A deterministic loom of deep-teal packet tiles feeds one acid-lime outgoing packet through an intentional channel.</desc>
  <defs>
    <linearGradient id="loom-teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075B5C"/><stop offset="1" stop-color="#00494D"/></linearGradient>
    <linearGradient id="loom-lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C8FF00"/><stop offset="1" stop-color="#AEEE00"/></linearGradient>
  </defs>
  <g fill="url(#loom-teal)">
    <rect x="7" y="8" width="35" height="35" rx="8"/>
    <rect x="50" y="8" width="35" height="35" rx="8"/>
    <rect x="7" y="50" width="35" height="35" rx="8"/>
    <rect x="7" y="92" width="35" height="35" rx="8"/>
    <rect x="50" y="92" width="35" height="35" rx="8"/>
    <path d="M80 37 104 59M80 98 104 76" fill="none" stroke="#075354" stroke-width="6" stroke-linecap="round"/>
    <rect x="99" y="50" width="38" height="38" rx="9" fill="url(#loom-lime)"/>
  </g>
</svg>
