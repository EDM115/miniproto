<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Clocked Core logo concept for miniproto</title>
  <desc id="description">One open magenta timing orbit and three acknowledgement nodes synchronize around a stable amber core, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="orbit-magenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF3AA7"/><stop offset="1" stop-color="#F41478"/></linearGradient>
    <linearGradient id="core-amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC029"/><stop offset="1" stop-color="#FF9D00"/></linearGradient>
    <style>@font-face{font-family:'Miniproto Nunito Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:800;font-display:block}.wordmark-heavy{font-family:'Miniproto Nunito Embedded';font-size:84px;font-style:normal;font-weight:800;letter-spacing:-2px}</style>
    <text id="wordmark" x="0" y="70" class="wordmark-heavy" fill="currentColor">miniproto</text>
    <g id="mark-color" fill="none" stroke="url(#orbit-magenta)" stroke-width="12" stroke-linecap="round"><path d="M107 39A50 50 0 1 1 93 23"/><circle cx="21" cy="39" r="11.5" fill="#FF2D96" stroke="none"/><circle cx="114" cy="64" r="11.5" fill="#FF2D96" stroke="none"/><circle cx="39" cy="107" r="11.5" fill="#FF2D96" stroke="none"/><rect x="46" y="46" width="36" height="36" rx="9" fill="url(#core-amber)" stroke="none"/></g>
    <g id="mark-mono" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><path d="M107 39A50 50 0 1 1 93 23"/><circle cx="21" cy="39" r="11.5" fill="currentColor" stroke="none"/><circle cx="114" cy="64" r="11.5" fill="currentColor" stroke="none"/><circle cx="39" cy="107" r="11.5" fill="currentColor" stroke="none"/><rect x="46" y="46" width="36" height="36" rx="9" fill="currentColor" stroke="none"/></g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#F1EBF2"/><rect x="24" y="24" width="564" height="300" rx="22" fill="#FAF7F2" stroke="#DDD1DE"/><rect x="612" y="24" width="564" height="300" rx="22" fill="#160B20"/><rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFCF8" stroke="#DDD1DE"/><rect x="612" y="348" width="564" height="348" rx="22" fill="#1D1028"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(74 110) scale(.78)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(202 108) scale(.95)" style="color:#100720"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(662 110) scale(.78)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(790 108) scale(.95)" style="color:#FAF7F2"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(82 413) scale(.90)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(235 432) scale(.87)" style="color:#100720"/><use href="#mark-mono" xlink:href="#mark-mono" transform="translate(96 585) scale(.64)" style="color:#151B2C"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(664 416) scale(.84)" style="color:#FFFFFF"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(808 432) scale(.84)" style="color:#FFFFFF"/>
  <g transform="translate(690 585)"><rect width="82" height="82" rx="18" fill="#FAF7F2"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(9 9) scale(.5)"/></g><g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#FAF7F2"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(9 9) scale(.31)"/></g><g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#FAF7F2"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(10 10) scale(.125)"/></g>
</svg>
