    <g id="mark-mono" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"><path d="M107 39A50 50 0 1 1 93 23"/><circle cx="21" cy="39" r="9" fill="currentColor" stroke="none"/><circle cx="114" cy="64" r="9" fill="currentColor" stroke="none"/><circle cx="39" cy="107" r="9" fill="currentColor" stroke="none"/><rect x="46" y="46" width="36" height="36" rx="9" fill="currentColor" stroke="none"/></g>
