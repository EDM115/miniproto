<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 136 128" role="img" aria-labelledby="title description">
  <title id="title">Clocked Core mark</title>
  <desc id="description">One open magenta timing orbit and three acknowledgement nodes synchronize around a stable amber core.</desc>
  <defs>
    <linearGradient id="orbit-magenta" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF3AA7"/><stop offset="1" stop-color="#F41478"/></linearGradient>
    <linearGradient id="core-amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC029"/><stop offset="1" stop-color="#FF9D00"/></linearGradient>
  </defs>
  <g fill="none" stroke="url(#orbit-magenta)" stroke-width="12" stroke-linecap="round">
    <path d="M107 39A50 50 0 1 1 93 23"/>
    <circle cx="21" cy="39" r="11.5" fill="#FF2D96" stroke="none"/>
    <circle cx="114" cy="64" r="11.5" fill="#FF2D96" stroke="none"/>
    <circle cx="39" cy="107" r="11.5" fill="#FF2D96" stroke="none"/>
    <rect x="46" y="46" width="36" height="36" rx="9" fill="url(#core-amber)" stroke="none"/>
  </g>
</svg>
