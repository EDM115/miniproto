<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Packet Plane logo concept for miniproto</title>
  <desc id="description">An original folded data plane points forward while three rounded packet blocks leave its rear fold, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="plane-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12D8F4"/><stop offset="1" stop-color="#00A9E8"/></linearGradient>
    <linearGradient id="plane-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#167BFF"/><stop offset="1" stop-color="#1645E8"/></linearGradient>
    <mask id="plane-cut"><rect width="216" height="160" fill="#fff"/><path d="M97 80 129 91 113 101 95 123 102 101 85 91Z" fill="#000"/></mask>
    <style>@font-face{font-family:'Miniproto Nunito Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:800;font-display:block}.wordmark-heavy{font-family:'Miniproto Nunito Embedded';font-size:84px;font-style:normal;font-weight:800;letter-spacing:-2px}</style>
    <text id="wordmark" x="0" y="70" class="wordmark-heavy" fill="currentColor">miniproto</text>
    <g id="mark-color"><g mask="url(#plane-cut)"><path d="M36 65 205 8 108 148 77 116 93 82Z" fill="url(#plane-blue)"/><path d="M36 65 205 8 91 80Z" fill="url(#plane-cyan)"/><path d="M91 80 139 60 108 148 77 116Z" fill="#0C47C9"/></g><rect x="0" y="79" width="23" height="17" rx="4" fill="#FF5C43" transform="rotate(-18 11.5 87.5)"/><rect x="26" y="100" width="23" height="17" rx="4" fill="#2462F2" transform="rotate(-18 37.5 108.5)"/><rect x="0" y="123" width="23" height="17" rx="4" fill="#0EBCE6" transform="rotate(-18 11.5 131.5)"/></g>
    <g id="mark-mono" fill="currentColor"><g mask="url(#plane-cut)"><path d="M36 65 205 8 108 148 77 116 93 82Z"/><path d="M36 65 205 8 91 80Z"/><path d="M91 80 139 60 108 148 77 116Z"/></g><rect x="0" y="79" width="23" height="17" rx="4" transform="rotate(-18 11.5 87.5)"/><rect x="26" y="100" width="23" height="17" rx="4" transform="rotate(-18 37.5 108.5)"/><rect x="0" y="123" width="23" height="17" rx="4" transform="rotate(-18 11.5 131.5)"/></g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#E8EFF8"/><rect x="24" y="24" width="564" height="300" rx="22" fill="#FAFCFF" stroke="#CAD7EA"/><rect x="612" y="24" width="564" height="300" rx="22" fill="#07192D"/><rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFFFF" stroke="#CAD7EA"/><rect x="612" y="348" width="564" height="348" rx="22" fill="#0A213A"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(62 97) scale(.70 .84)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(220 108) scale(.90)" style="color:#07182E"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(650 97) scale(.70 .84)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(808 108) scale(.90)" style="color:#F8FAFD"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(72 414) scale(.65)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(218 437) scale(.80)" style="color:#07182E"/><use href="#mark-mono" xlink:href="#mark-mono" transform="translate(88 582) scale(.54)" style="color:#111B2D"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(650 411) scale(.72)" style="color:#FFFFFF"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(810 434) scale(.78)" style="color:#FFFFFF"/>
  <g transform="translate(690 585)"><rect width="82" height="82" rx="18" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(1 12) scale(.39)"/></g><g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(2 11) scale(.27)"/></g><g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#F8FAFD"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(2 10) scale(.15)"/></g>
</svg>
