<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 -58 479 479" fill="none">
  <defs>
    <linearGradient id="planeBlue" gradientUnits="userSpaceOnUse" x1="235" y1="145" x2="395" y2="315">
      <stop offset="0" stop-color="#015EF3"/>
      <stop offset="1" stop-color="#015CF0"/>
    </linearGradient>
    <linearGradient id="cyanWing" gradientUnits="userSpaceOnUse" x1="95" y1="150" x2="440" y2="40">
      <stop offset="0" stop-color="#02C1FE"/>
      <stop offset="1" stop-color="#00C0FE"/>
    </linearGradient>
    <linearGradient id="centerBlue" gradientUnits="userSpaceOnUse" x1="168" y1="175" x2="279" y2="210">
      <stop offset="0" stop-color="#0261F4"/>
      <stop offset="1" stop-color="#015BED"/>
    </linearGradient>
    <linearGradient id="foldBlue" gradientUnits="userSpaceOnUse" x1="278" y1="193" x2="193" y2="292">
      <stop offset="0" stop-color="#004DD1"/>
      <stop offset="1" stop-color="#014ACC"/>
    </linearGradient>
    <linearGradient id="orange" gradientUnits="userSpaceOnUse" x1="39" y1="178" x2="84" y2="215">
      <stop offset="0" stop-color="#FC6542"/>
      <stop offset="1" stop-color="#FA5F3D"/>
    </linearGradient>
    <linearGradient id="squareBlue" gradientUnits="userSpaceOnUse" x1="94" y1="198" x2="143" y2="238">
      <stop offset="0" stop-color="#0262F5"/>
      <stop offset="1" stop-color="#015BEC"/>
    </linearGradient>
    <linearGradient id="squareCyan" gradientUnits="userSpaceOnUse" x1="64" y1="252" x2="114" y2="292">
      <stop offset="0" stop-color="#03C3FE"/>
      <stop offset="1" stop-color="#01BFFC"/>
    </linearGradient>
    <filter id="softBlur" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
    <filter id="tileBlur" x="-45%" y="-45%" width="200%" height="205%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- One soft shadow for the complete plane silhouette. -->
  <path d="
    M 433.90 39.55
    C 438.25 38.45 443.55 39.55 446.20 43.15
    C 448.65 46.45 447.05 50.55 444.35 53.85
    L 246.00 322.30
    C 244.20 324.90 242.15 326.85 239.55 327.35
    C 236.70 327.85 233.75 326.40 231.15 324.05
    L 194.45 291.75
    C 192.85 290.30 192.50 288.25 193.05 286.15
    L 210.27 205.53
    L 96.00 153.10
    C 92.80 151.65 91.65 149.05 92.05 145.85
    C 92.45 142.80 94.35 140.35 97.10 139.20
    Z" fill="#557AA9" opacity="0.06" transform="translate(3 4)" filter="url(#softBlur)"/>

  <g shape-rendering="geometricPrecision">
    <!-- Main outer body -->
    <path fill="url(#planeBlue)" d="
      M 234.802 150.231
      L 439.75 40.25
      C 442.75 39.45 445.65 41.10 446.85 43.80
      C 448.20 46.85 446.85 50.45 444.35 53.85
      L 246.00 322.30
      C 244.20 324.90 242.15 326.85 239.55 327.35
      C 236.70 327.85 233.75 326.40 231.15 324.05
      L 194.45 291.75
      C 192.85 290.35 192.65 288.85 193.25 287.35
      L 224.542 263.515
      L 318.655 188.033
      Z"/>

    <!-- Upper cyan wing -->
    <path fill="url(#cyanWing)" d="
      M 167.710 185.969
      L 96.00 153.10
      C 92.80 151.65 91.65 149.05 92.05 145.85
      C 92.45 142.80 94.35 140.35 97.10 139.20
      L 433.90 39.55
      C 436.10 38.95 438.55 39.10 439.75 40.25
      Z"/>

    <!-- Central bright fold -->
    <path fill="url(#centerBlue)" d="M 167.710 185.969 L 216.228 160.125 L 278.526 193.107 L 210.269 205.531 Z"/>

    <!-- Dark inner fold -->
    <path fill="url(#foldBlue)" d="M 210.269 205.531 L 278.526 193.107 L 224.542 263.515 L 193.250 287.350 L 192.133 291.951 Z"/>
  </g>

  <!-- Soft tile shadows -->
  <g fill="#557AA9" opacity="0.08" transform="translate(2.2 3.1)" filter="url(#tileBlur)">
    <rect x="36.5" y="178.9" width="49.5" height="34.1" rx="7.3" transform="rotate(-23.2 61.25 195.95)"/>
    <rect x="93.5" y="200.4" width="50.4" height="35.3" rx="7.5" transform="rotate(-23.2 118.7 218.05)"/>
    <rect x="63.6" y="255.0" width="50.1" height="34.4" rx="7.4" transform="rotate(-24.6 88.65 272.2)"/>
  </g>

  <!-- Trailing tiles -->
  <g>
    <rect x="36.5" y="178.9" width="49.5" height="34.1" rx="7.3" fill="url(#orange)" transform="rotate(-23.2 61.25 195.95)"/>
    <rect x="93.5" y="200.4" width="50.4" height="35.3" rx="7.5" fill="url(#squareBlue)" transform="rotate(-23.2 118.7 218.05)"/>
    <rect x="63.6" y="255.0" width="50.1" height="34.4" rx="7.4" fill="url(#squareCyan)" transform="rotate(-24.6 88.65 272.2)"/>
