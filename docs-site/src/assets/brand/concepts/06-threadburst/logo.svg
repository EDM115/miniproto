<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-38 -38 206 206" role="img" aria-labelledby="title description">
  <title id="title">Threadburst mark</title>
  <desc id="description">Four symmetric rounded execution strands curl around one compact amber native core.</desc>
