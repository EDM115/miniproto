    <linearGradient id="strand-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05AEEE"/><stop offset="1" stop-color="#08BEE8"/></linearGradient>
    <linearGradient id="strand-blue" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#385EEF"/><stop offset="1" stop-color="#2C56EC"/></linearGradient>
  </defs>
