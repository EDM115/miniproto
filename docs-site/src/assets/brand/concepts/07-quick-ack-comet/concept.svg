<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Quick-Ack Comet logo concept for miniproto</title>
  <desc id="description">One signal packet accelerates through two notched acknowledgement echoes as a compact comet, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="ack-indigo" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5E2CF4"/><stop offset="1" stop-color="#3348EF"/></linearGradient>
    <linearGradient id="ack-cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A9E8"/><stop offset="1" stop-color="#19D2F1"/></linearGradient>
    <linearGradient id="ack-lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D2F800"/><stop offset="1" stop-color="#B6ED00"/></linearGradient>
    <mask id="outer-ack-notch"><rect width="190" height="160" fill="#FFFFFF"/><rect x="63" y="20" width="16" height="30" rx="5" fill="#000000" transform="rotate(-28 71 35)"/></mask>
    <mask id="inner-ack-notch"><rect width="190" height="160" fill="#FFFFFF"/><rect x="88" y="20" width="15" height="30" rx="5" fill="#000000" transform="rotate(-27 95.5 35)"/></mask>
    <style>@font-face{font-family:'Miniproto Quicksand Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:300 700;font-display:block}.wordmark-light{font-family:'Miniproto Quicksand Embedded';font-size:84px;font-style:normal;font-weight:600;letter-spacing:-1px}</style>
    <text id="wordmark" x="0" y="70" class="wordmark-light" fill="currentColor">miniproto</text>
    <g id="mark-color"><path d="M31 150C2 137 0 107 14 78C31 43 67 20 114 12L121 39C85 45 58 62 43 86C29 107 24 128 31 150Z" fill="url(#ack-indigo)" mask="url(#outer-ack-notch)"/><path d="M67 150C39 134 36 103 50 77C66 49 94 31 132 22L138 48C109 54 87 68 76 87C64 106 61 128 67 150Z" fill="url(#ack-cyan)" mask="url(#inner-ack-notch)"/><rect x="109" y="0" width="62" height="60" rx="14" fill="url(#ack-lime)" transform="rotate(11 140 30)"/></g>
    <g id="mark-mono" fill="currentColor"><path d="M31 150C2 137 0 107 14 78C31 43 67 20 114 12L121 39C85 45 58 62 43 86C29 107 24 128 31 150Z" mask="url(#outer-ack-notch)"/><path d="M67 150C39 134 36 103 50 77C66 49 94 31 132 22L138 48C109 54 87 68 76 87C64 106 61 128 67 150Z" mask="url(#inner-ack-notch)"/><rect x="109" y="0" width="62" height="60" rx="14" transform="rotate(11 140 30)"/></g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#E9EDF7"/><rect x="24" y="24" width="564" height="300" rx="22" fill="#FAFCFF" stroke="#CFD7E8"/><rect x="612" y="24" width="564" height="300" rx="22" fill="#08142D"/><rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFFFF" stroke="#CFD7E8"/><rect x="612" y="348" width="564" height="348" rx="22" fill="#101B35"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(60 94) scale(.78)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(215 108) scale(.94)" style="color:#08142D"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(648 94) scale(.78)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(803 108) scale(.94)" style="color:#F8FAFD"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(70 404) scale(.78)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(220 431) scale(.86)" style="color:#08142D"/><use href="#mark-mono" xlink:href="#mark-mono" transform="translate(88 578) scale(.58)" style="color:#111B2D"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(650 404) scale(.82)" style="color:#FFFFFF"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(810 431) scale(.82)" style="color:#FFFFFF"/>
  <g transform="translate(690 585)"><rect width="82" height="82" rx="18" fill="#FAFCFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 9) scale(.43)"/></g><g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#FAFCFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 9) scale(.30)"/></g><g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#FAFCFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(3 9) scale(.17)"/></g>
</svg>
