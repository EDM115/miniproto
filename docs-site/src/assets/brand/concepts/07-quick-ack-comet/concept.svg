    <linearGradient id="ack-cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A9E8"/><stop offset="1" stop-color="#19D2F1"/></linearGradient>
    <g id="wordmark" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M4 60V28c0-9 6-15 14-15s14 6 14 15v32M32 28c0-9 6-15 14-15s14 6 14 15v32M80 22v38M80 5h.01M100 60V28c0-9 6-15 16-15s16 6 16 15v32M152 22v38M152 5h.01M172 78V13m0 17c0-10 7-17 16-17 11 0 18 9 18 23s-7 24-18 24c-9 0-16-7-16-17M226 60V30c0-10 7-17 17-17m-17 15c4-9 11-15 20-15M280 13c-13 0-22 10-22 23s9 24 22 24 22-11 22-24-9-23-22-23ZM330 2v44c0 10 5 15 14 15M318 18h27M382 13c-13 0-22 10-22 23s9 24 22 24 22-11 22-24-9-23-22-23Z"/></g>
