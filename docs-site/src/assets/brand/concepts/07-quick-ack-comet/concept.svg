    <g id="mark-mono" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M15 113C18 66 48 29 105 14" stroke-width="17" stroke-dasharray="48 8 92"/><path d="M49 116C50 77 72 47 114 30" stroke-width="17" stroke-dasharray="44 8 76"/><rect x="108" y="8" width="43" height="43" rx="11" fill="currentColor" stroke="none" transform="rotate(9 129.5 29.5)"/></g>
