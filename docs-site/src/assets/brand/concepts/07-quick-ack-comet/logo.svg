<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-12 -14 204 180" role="img" aria-labelledby="title description">
  <title id="title">Quick-Ack Comet mark</title>
  <desc id="description">One signal packet aligns with two top-notched acknowledgement trails as a compact comet.</desc>
  <defs>
    <linearGradient id="ack-indigo" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#5E2CF4"/><stop offset="1" stop-color="#3348EF"/></linearGradient>
    <linearGradient id="ack-cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00A9E8"/><stop offset="1" stop-color="#19D2F1"/></linearGradient>
    <linearGradient id="ack-lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D2F800"/><stop offset="1" stop-color="#B6ED00"/></linearGradient>
    <mask id="outer-ack-notch" maskUnits="userSpaceOnUse" x="-12" y="-14" width="204" height="180"><rect x="-12" y="-14" width="204" height="180" fill="#fff"/><rect x="20" y="44" width="16" height="27" rx="5" fill="#000" transform="rotate(-28 28 57.5)"/></mask>
    <mask id="inner-ack-notch" maskUnits="userSpaceOnUse" x="-12" y="-14" width="204" height="180"><rect x="-12" y="-14" width="204" height="180" fill="#fff"/><rect x="66" y="36" width="15" height="27" rx="5" fill="#000" transform="rotate(-27 73.5 49.5)"/></mask>
  </defs>
  <path d="M31 150C2 137 0 107 14 78C31 43 67 20 114 12L121 39C85 45 58 62 43 86C29 107 24 128 31 150Z" fill="url(#ack-indigo)" mask="url(#outer-ack-notch)"/>
  <path d="M67 150C39 134 36 103 50 77C66 49 94 31 132 22L138 48C109 54 87 68 76 87C64 106 61 128 67 150Z" fill="url(#ack-cyan)" mask="url(#inner-ack-notch)"/>
  <rect x="109" y="0" width="62" height="60" rx="14" fill="url(#ack-lime)" transform="rotate(11 140 30)"/>
</svg>
