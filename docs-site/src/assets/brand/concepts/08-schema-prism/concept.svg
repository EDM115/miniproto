<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Schema Prism logo concept for miniproto</title>
  <desc id="description">Three colored source faces reconcile inside an asymmetric protocol prism that emits one rounded constructor tile, shown as color, monochrome, light, dark, and small-size vector treatments.</desc>
  <defs>
    <linearGradient id="prism-violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B77AFF"/><stop offset="1" stop-color="#8B55F5"/></linearGradient>
    <linearGradient id="prism-aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#58E6E2"/><stop offset="1" stop-color="#23C8D1"/></linearGradient>
    <linearGradient id="prism-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#264BFF"/><stop offset="1" stop-color="#1234DA"/></linearGradient>
    <mask id="prism-mono-cut"><rect width="150" height="130" fill="#FFFFFF"/><path d="M16 48 75 64 72 8M75 64 128 50M75 64 66 119" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/></mask>
    <style>@font-face{font-family:'Miniproto Quicksand Embedded';src:url(data:font/woff2;base64,) format('woff2');font-style:normal;font-weight:300 700;font-display:block}.wordmark-light{font-family:'Miniproto Quicksand Embedded';font-size:84px;font-style:normal;font-weight:600;letter-spacing:-1px}</style>
    <text id="wordmark" x="0" y="70" class="wordmark-light" fill="currentColor">miniproto</text>
    <g id="mark-color" stroke-linejoin="round"><path d="M16 48 72 8 75 64Z" fill="url(#prism-violet)"/><path d="M72 8 128 50 75 64Z" fill="url(#prism-aqua)"/><path d="M16 48 75 64 66 119Z" fill="url(#prism-blue)"/><path d="M75 64 128 50 101 94 66 119Z" fill="#0B1B58"/><rect x="96" y="78" width="48" height="42" rx="11" fill="#FFF4D6" transform="rotate(-18 120 99)"/></g>
    <g id="mark-mono" fill="currentColor"><path d="M16 48 72 8 128 50 101 94 66 119Z" mask="url(#prism-mono-cut)"/><rect x="96" y="78" width="48" height="42" rx="11" transform="rotate(-18 120 99)"/></g>
  </defs>
  <rect width="1200" height="720" rx="30" fill="#EEEAF7"/><rect x="24" y="24" width="564" height="300" rx="22" fill="#FCFAFF" stroke="#D7D0E8"/><rect x="612" y="24" width="564" height="300" rx="22" fill="#09132D"/><rect x="24" y="348" width="564" height="348" rx="22" fill="#FFFFFF" stroke="#D7D0E8"/><rect x="612" y="348" width="564" height="348" rx="22" fill="#101A38"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(55 90) scale(1.08)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(225 110) scale(.90)" style="color:#09132D"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(643 90) scale(1.08)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(813 110) scale(.90)" style="color:#FBF9FF"/>
  <use href="#mark-color" xlink:href="#mark-color" transform="translate(70 396) scale(1.10)"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(245 431) scale(.82)" style="color:#09132D"/><use href="#mark-mono" xlink:href="#mark-mono" transform="translate(91 585) scale(.62)" style="color:#151B2C"/>
  <use href="#mark-mono" xlink:href="#mark-mono" transform="translate(659 411) scale(.90)" style="color:#FFFFFF"/><use href="#wordmark" xlink:href="#wordmark" transform="translate(810 431) scale(.82)" style="color:#FFFFFF"/>
  <g transform="translate(690 585)"><rect width="82" height="82" rx="18" fill="#FCFAFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(5 9) scale(.5)"/></g><g transform="translate(814 598)"><rect width="58" height="58" rx="14" fill="#FCFAFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(6 9) scale(.31)"/></g><g transform="translate(914 611)"><rect width="36" height="36" rx="9" fill="#FCFAFF"/><use href="#mark-color" xlink:href="#mark-color" transform="translate(6 9) scale(.17)"/></g>
</svg>
