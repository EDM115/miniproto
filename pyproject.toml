[build-system]
requires = ["maturin==1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "miniproto"
version = "0.0.1"
description = "Async-first MTProto client core for Python with bundled Rust acceleration"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "EDM115", email = "miniproto@edm115.dev" }]
keywords = ["telegram", "mtproto", "asyncio", "pyo3", "rust"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
dependencies = [
  "cryptography==49.0.0",
  "uvloop==0.22.1; (sys_platform == 'linux' or sys_platform == 'darwin') and implementation_name == 'cpython'",
  "winloop==0.6.3; (sys_platform == 'win32' or sys_platform == 'cygwin' or sys_platform == 'cli') and implementation_name == 'cpython'",
]

[project.optional-dependencies]
dev = [
  "maturin==1.14.1,<2.0",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "ty==0.0.59",
]

[project.urls]
Homepage = "https://github.com/EDM115/miniproto"
Issues = "https://github.com/EDM115/miniproto/issues"
Funding = "https://github.com/EDM115#support-me-"

[tool.maturin]
module-name = "miniproto._native"
python-source = "src"
manifest-path = "rust/miniproto/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = [".venv", ".tmp"]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
# future-annotations = true
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "N", "S", "W"]
ignore = ["S101", "E501", "N818"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
exclude = [".venv", ".tmp"]

[tool.uv]
compile-bytecode = true
link-mode = "copy"

[tool.uv.pip]
compile-bytecode = true
generate-hashes = true
link-mode = "copy"
