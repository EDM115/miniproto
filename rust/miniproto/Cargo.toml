[package]
description = "Rust acceleration layer for the miniproto Python MTProto SDK"
documentation = "https://docs.rs/miniproto"
edition = "2024"
homepage = "https://miniproto.edm115.dev/"
keywords = ["telegram", "mtproto", "pyo3", "python", "cryptography"]
license = "MIT"
name = "miniproto"
categories = ["api-bindings", "cryptography", "network-programming"]
publish = ["crates-io"]
readme = "README.md"
repository = "https://github.com/EDM115/miniproto"
rust-version = "1.97"
version = "0.1.0"

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.0"
cipher = "0.5.2"
getrandom = "0.4.3"
pyo3 = { version = "~0.29.2", features = ["experimental-async"] }
scrypt = "0.12.0"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2.6"

[lib]
name = "miniproto_native"
crate-type = ["cdylib"]
